# Reference Artifact Manifest
#
# Every tests/data/master_* file MUST be listed here.
# The verify_reference_artifacts.sh script uses this manifest to:
#   1. Regenerate each artifact and compare against the committed version
#   2. Detect orphan master_* files not declared here (fails if any found)
#
# comparison_method:
#   gzip_content  - decompress with gzip -cd before diff (.mat files)
#   direct        - byte-for-byte diff (.tab files)
#
# Paths use these variables (resolved by the verifier):
#   {data_root}           = deeptools/deeptools/test/test_heatmapper
#   {test_data_root}      = deeptools/deeptools/test/test_data
#   {blacklist_data_root} = tests/data

path_variables:
  data_root: "deeptools/deeptools/test/test_heatmapper"
  test_data_root: "deeptools/deeptools/test/test_data"
  blacklist_data_root: "tests/data"

artifacts:
  # ── Blacklist reference-point ─────────────────────────────────────────
  - output: master_blacklist.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix reference-point
      -S {data_root}/test.bw
      -R {data_root}/test2.bed
      -b 100 -a 100 -bs 1 -p 1
      --blackListFileName {blacklist_data_root}/test_blacklist.bed
      -o {out.mat}
      --outFileNameMatrix {out.tab}
    input_dependencies:
      - "{data_root}/test.bw"
      - "{data_root}/test2.bed"
      - "{blacklist_data_root}/test_blacklist.bed"
    paired_tab: master_blacklist.tab

  - output: master_blacklist.tab
    comparison_method: direct
    # Generated as a side-effect of master_blacklist.mat command
    generated_by: master_blacklist.mat

  - output: master_blacklist_nan_to_zero.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix reference-point
      -S {data_root}/test.bw
      -R {data_root}/test2.bed
      -b 100 -a 100 -bs 1 -p 1
      --missingDataAsZero
      --blackListFileName {blacklist_data_root}/test_blacklist.bed
      -o {out.mat}
      --outFileNameMatrix {out.tab}
    input_dependencies:
      - "{data_root}/test.bw"
      - "{data_root}/test2.bed"
      - "{blacklist_data_root}/test_blacklist.bed"
    paired_tab: master_blacklist_nan_to_zero.tab

  - output: master_blacklist_nan_to_zero.tab
    comparison_method: direct
    generated_by: master_blacklist_nan_to_zero.mat

  # ── Blacklist scale-regions ───────────────────────────────────────────
  - output: master_scale_reg_blacklist.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix scale-regions
      -S {data_root}/test.bw
      -R {data_root}/test2.bed
      -b 100 -a 100 -m 100 -bs 1 -p 1
      --blackListFileName {blacklist_data_root}/test_blacklist.bed
      -o {out.mat}
      --outFileNameMatrix {out.tab}
    input_dependencies:
      - "{data_root}/test.bw"
      - "{data_root}/test2.bed"
      - "{blacklist_data_root}/test_blacklist.bed"
    paired_tab: master_scale_reg_blacklist.tab

  - output: master_scale_reg_blacklist.tab
    comparison_method: direct
    generated_by: master_scale_reg_blacklist.mat

  - output: master_scale_reg_blacklist_nan_to_zero.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix scale-regions
      -S {data_root}/test.bw
      -R {data_root}/test2.bed
      -b 100 -a 100 -m 100 -bs 1 -p 1
      --missingDataAsZero
      --blackListFileName {blacklist_data_root}/test_blacklist.bed
      -o {out.mat}
      --outFileNameMatrix {out.tab}
    input_dependencies:
      - "{data_root}/test.bw"
      - "{data_root}/test2.bed"
      - "{blacklist_data_root}/test_blacklist.bed"
    paired_tab: master_scale_reg_blacklist_nan_to_zero.tab

  - output: master_scale_reg_blacklist_nan_to_zero.tab
    comparison_method: direct
    generated_by: master_scale_reg_blacklist_nan_to_zero.mat

  # ── Blacklist empty-group ─────────────────────────────────────────────
  - output: master_blacklist_empty_group_no.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix reference-point
      -R {blacklist_data_root}/test_blacklist_empty_group.bed
      -S {data_root}/test.bw
      -b 100 -a 100 -bs 1 -p 1
      --sortRegions no
      --blackListFileName {blacklist_data_root}/test_blacklist.bed
      -o {out.mat}
    input_dependencies:
      - "{data_root}/test.bw"
      - "{blacklist_data_root}/test_blacklist_empty_group.bed"
      - "{blacklist_data_root}/test_blacklist.bed"

  - output: master_blacklist_empty_group_descend.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix reference-point
      -R {blacklist_data_root}/test_blacklist_empty_group.bed
      -S {data_root}/test.bw
      -b 100 -a 100 -bs 1 -p 1
      --sortRegions descend
      --blackListFileName {blacklist_data_root}/test_blacklist.bed
      -o {out.mat}
    input_dependencies:
      - "{data_root}/test.bw"
      - "{blacklist_data_root}/test_blacklist_empty_group.bed"
      - "{blacklist_data_root}/test_blacklist.bed"

  # ── Metagene ──────────────────────────────────────────────────────────
  - output: master_metagene_blacklist_intron.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix scale-regions
      -R {test_data_root}/test.gtf
      -S {test_data_root}/test1.bw.bw
      -a 300 -b 500
      --unscaled5prime 20 --unscaled3prime 50
      -bs 10 -p 1
      --metagene
      --blackListFileName {blacklist_data_root}/test_blacklist_intron.bed
      -o {out.mat}
    input_dependencies:
      - "{test_data_root}/test.gtf"
      - "{test_data_root}/test1.bw.bw"
      - "{blacklist_data_root}/test_blacklist_intron.bed"

  - output: master_metagene_blacklist_intron_nan_to_zero.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix scale-regions
      -R {test_data_root}/test.gtf
      -S {test_data_root}/test1.bw.bw
      -a 300 -b 500
      --unscaled5prime 20 --unscaled3prime 50
      -bs 10 -p 1
      --metagene --missingDataAsZero
      --blackListFileName {blacklist_data_root}/test_blacklist_intron.bed
      -o {out.mat}
    input_dependencies:
      - "{test_data_root}/test.gtf"
      - "{test_data_root}/test1.bw.bw"
      - "{blacklist_data_root}/test_blacklist_intron.bed"

  - output: master_metagene_nan_to_zero.mat
    comparison_method: gzip_content
    command: >-
      pixi run computeMatrix scale-regions
      -R {test_data_root}/test.gtf
      -S {test_data_root}/test1.bw.bw
      -a 300 -b 500
      --unscaled5prime 20 --unscaled3prime 50
      -bs 10 -p 1
      --metagene --missingDataAsZero
      -o {out.mat}
    input_dependencies:
      - "{test_data_root}/test.gtf"
      - "{test_data_root}/test1.bw.bw"

# Python Compatibility Test Configuration
#
# This file defines all test scenarios extracted from test_heatmapper.py
# for validating the Rust computeMatrix implementation against Python DeepTools.

test_suites:
  python_compatibility:
    description: "All 10 computeMatrix tests from test_heatmapper.py"
    data_root: "deeptools/deeptools/test/test_heatmapper"
    test_data_root: "deeptools/deeptools/test/test_data"
    
    scenarios:
      # Core Reference-Point Tests
      - name: reference_point_basic
        python_test: test_computeMatrix_reference_point
        reference_matrix: master.mat
        rust_args:
          - reference-point
          - -R
          - "{data_root}/test2.bed"
          - -S
          - "{data_root}/test.bw"
          - -b
          - "100"
          - -a
          - "100"
          - -bs
          - "1"
          - -p
          - "1"
        tolerance: 0
        
      - name: reference_point_center
        python_test: test_computeMatrix_reference_point_center
        reference_matrix: master_center.mat
        rust_args:
          - reference-point
          - -R
          - "{data_root}/test2.bed"
          - -S
          - "{data_root}/test.bw"
          - -b
          - "100"
          - -a
          - "100"
          - --referencePoint
          - center
          - -bs
          - "1"
          - -p
          - "1"
        tolerance: 0
        
      - name: reference_point_tes
        python_test: test_computeMatrix_reference_point_tes
        reference_matrix: master_TES.mat
        rust_args:
          - reference-point
          - -R
          - "{data_root}/test2.bed"
          - -S
          - "{data_root}/test.bw"
          - -b
          - "100"
          - -a
          - "100"
          - --referencePoint
          - TES
          - -bs
          - "1"
          - -p
          - "1"
        tolerance: 0
        
      - name: reference_point_missing_data_as_zero
        python_test: test_computeMatrix_reference_point_missing_data_as_zero
        reference_matrix: master_nan_to_zero.mat
        rust_args:
          - reference-point
          - -R
          - "{data_root}/test2.bed"
          - -S
          - "{data_root}/test.bw"
          - -b
          - "100"
          - -a
          - "100"
          - -bs
          - "1"
          - -p
          - "1"
          - --missingDataAsZero
        tolerance: 0

      # Core Scale-Regions Tests
      - name: scale_regions_basic
        python_test: test_computeMatrix_scale_regions
        reference_matrix: master_scale_reg.mat
        rust_args:
          - scale-regions
          - -R
          - "{data_root}/test2.bed"
          - -S
          - "{data_root}/test.bw"
          - -b
          - "100"
          - -a
          - "100"
          - -m
          - "100"
          - -bs
          - "1"
          - -p
          - "1"
        tolerance: 0

      # Multiple BED Files Test
      - name: multiple_bed
        python_test: test_computeMatrix_multiple_bed
        reference_matrix: master_multibed.mat
        rust_args:
          - reference-point
          - -R
          - "{data_root}/group1.bed"
          - "{data_root}/group2.bed"
          - -S
          - "{data_root}/test.bw"
          - -b
          - "100"
          - -a
          - "100"
          - -bs
          - "1"
          - -p
          - "1"
        tolerance: 0

      # Region Extends Beyond Chromosome End
      - name: region_extend_beyond_chr
        python_test: test_computeMatrix_region_extend_over_chr_end
        reference_matrix: master_extend_beyond_chr_size.mat
        rust_args:
          - reference-point
          - -R
          - "{data_root}/group1.bed"
          - "{data_root}/group2.bed"
          - -S
          - "{data_root}/test.bw"
          - -b
          - "100"
          - -a
          - "500"
          - -bs
          - "1"
          - -p
          - "1"
        tolerance: 0

      # Scale-Regions with Unscaled Flanks
      - name: scale_regions_unscaled
        python_test: test_computeMatrix_unscaled
        reference_matrix: master_unscaled.mat
        rust_args:
          - scale-regions
          - -R
          - "{data_root}/unscaled.bed"
          - -S
          - "{data_root}/unscaled.bigWig"
          - -a
          - "300"
          - -b
          - "500"
          - --unscaled5prime
          - "100"
          - --unscaled3prime
          - "50"
          - -bs
          - "10"
          - -p
          - "1"
        tolerance: 0

      # GTF Input (Advanced)
      - name: gtf_input
        python_test: test_computeMatrix_gtf
        reference_matrix: master_gtf.mat
        rust_args:
          - scale-regions
          - -R
          - "{test_data_root}/test.gtf"
          - -S
          - "{test_data_root}/test1.bw.bw"
          - -a
          - "300"
          - -b
          - "500"
          - --unscaled5prime
          - "20"
          - --unscaled3prime
          - "50"
          - -bs
          - "10"
          - -p
          - "1"
        tolerance: 0

      # Metagene Mode (Advanced)
      - name: metagene
        python_test: test_computeMatrix_metagene
        reference_matrix: master_metagene.mat
        rust_args:
          - scale-regions
          - -R
          - "{test_data_root}/test.gtf"
          - -S
          - "{test_data_root}/test1.bw.bw"
          - -a
          - "300"
          - -b
          - "500"
          - --unscaled5prime
          - "20"
          - --unscaled3prime
          - "50"
          - -bs
          - "10"
          - -p
          - "1"
          - --metagene
        tolerance: 0

  # Extended testing with ENCODE data (existing infrastructure)
  encode_k562_atac:
    description: "Large-scale performance testing with ENCODE K562 ATAC-seq data"
    data_root: "target/compute-matrix-datasets/encode_k562_atac"
    scenarios:
      - name: reference_point_center_encode
        cross_validate: true
        tolerance: 1e-5
        # Uses dynamically generated command from harness

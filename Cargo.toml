[package]
name = "compute_matrix_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bigtools = { version = "0.16", default-features = false, features = ["bigwig"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.0", features = ["gzip"] }
polars = { version = "0.40.0", default-features = false, features = ["lazy", "performant"] }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

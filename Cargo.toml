[package]
name = "compute_matrix_rs"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "compare_matrix"
path = "src/bin/compare_matrix/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.0", features = ["zlib-rs"], default-features = true }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tempfile = "3.10"
itoa = "1.0"
bio = "3.0.0"
quick_cache = "0.6.21"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

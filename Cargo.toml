[package]
name = "compute_matrix_rs"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bigtools = { version = "0.5.6"}
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.0", features = ["zlib-rs"], default-features = true }
num_cpus = "1.16"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tempfile = "3.10"
itoa = "1.0"
bio = "3.0.0"

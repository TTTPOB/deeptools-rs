[package]
name = "compute_matrix_rs"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6"
flate2 = { version = "1.0", features = ["zlib-rs"], default-features = true }
num_cpus = "1.16"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tempfile = "3.10"
itoa = "1.0"
bio = "3.0.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

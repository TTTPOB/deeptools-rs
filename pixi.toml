[workspace]
name = "compute-matrix-rs"
version = "0.1.0"
description = "Support tooling for regression testing computeMatrix against the deepTools reference implementation"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
deeptools = "==3.5.6"

[tasks]
compat = "python scripts/harness.py compat"
verify-artifacts = "python scripts/harness.py verify-refs"
regen-artifacts = "python scripts/harness.py regen-refs"
bench-smoke = "python scripts/harness.py bench-smoke"
prepare-data = "python scripts/harness.py prepare-data"
encode = "python scripts/harness.py encode"

name: Rust CI & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --test python_compatibility -- --test-threads=1

      - name: Package binary
        run: |
          BIN_NAME=compute_matrix_rs

          mkdir -p artifacts
          tar czf "artifacts/${BIN_NAME}-${{ github.ref_name }}.tar.gz" -C target/release "$BIN_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-${{ github.ref_name }}
          path: artifacts/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: rust-build-${{ github.ref_name }}
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
